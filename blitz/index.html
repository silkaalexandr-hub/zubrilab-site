<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC93C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Зубрила Блиц</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen game — level map ⇄ play card with Yes/No ⇄ results. Single bright look (brand yellow + navy), same in both themes. */
:root{
  --sun:#FFC93C; --sun-deep:#F2A900; --ink:#1F2A44; --ink-soft:#4A5573;
  --paper:#FFF8E6; --yes:#22B573; --no:#F0533F; --sky:#5B8CFF; --white:#FFFFFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{background:var(--sun)}
body{background:var(--sun);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;gap:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- верх ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1}
.brand small{display:block;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.chip{background:var(--ink);color:var(--sun);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- карта уровней ---------- */
.hello{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 0 var(--ink)}
.hello img{width:72px;height:72px;border-radius:18px;flex:none}
.hello h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.hello p{margin:0;color:var(--ink-soft);font-size:.95rem}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lvl{aspect-ratio:1;max-width:100%;border-radius:20px;background:var(--white);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;transition:transform .1s}
.lvl:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lvl .st{font-size:.7rem;letter-spacing:1px;color:var(--sun-deep)}
.lvl.next{background:var(--ink);color:var(--sun)}
.lvl.next .st{color:var(--sun)}
.lvl:disabled{background:transparent;border-style:dashed;box-shadow:none;color:var(--ink-soft);opacity:.55;cursor:default}
.maphint{text-align:center;font-weight:600;color:var(--ink-soft);font-size:.9rem;margin:0}

/* ---------- игра ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{width:42px;height:42px;border-radius:14px;background:var(--paper);border:3px solid var(--ink);font-weight:800;font-size:1.1rem}
.hearts{font-size:1.35rem;letter-spacing:2px}
.hearts .off{filter:grayscale(1);opacity:.3}
.combo{font-family:var(--f-display);font-weight:800;font-size:.95rem;min-width:64px;text-align:right}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:8px;border-radius:4px;background:rgba(31,42,68,.18)}
.dots i.ok{background:var(--ink)} .dots i.bad{background:var(--no)} .dots i.now{background:var(--white)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:330px;position:relative}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 20px 30px;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;touch-action:pan-y;user-select:none;position:relative;will-change:transform}
.card .q{font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.card .en{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.1;white-space:nowrap;width:100%;overflow:hidden}
.card .eq{font-family:var(--f-display);font-weight:800;font-size:1.15em;line-height:1;color:var(--sun-deep);display:inline-block;margin-left:.12em;vertical-align:-.04em;animation:ask 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes ask{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-8px) rotate(-12deg)}40%{transform:translateY(0) rotate(10deg)}55%{transform:translateY(-3px) rotate(-5deg)}70%{transform:translateY(0) rotate(0) scale(1.08)}85%{transform:scale(1)}}
.card.good .eq,.card.bad .eq{animation:none}
.card .ru{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,9vw,2.6rem);line-height:1.15;white-space:nowrap;width:100%;min-height:1.6em;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ru>span:first-child{display:inline}
.say{background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.timer{position:absolute;left:22px;right:22px;bottom:12px;height:6px;border-radius:3px;background:rgba(31,42,68,.12);overflow:hidden}
.timer i{display:block;height:100%;background:var(--ink);transform-origin:left}
.stamp{position:absolute;top:16px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;padding:4px 12px;border-radius:10px;border:3px solid;opacity:0;pointer-events:none}
.stamp.y{right:16px;color:var(--yes);transform:rotate(10deg)} .stamp.n{left:16px;color:var(--no);transform:rotate(-10deg)}
.card.good{background:#E3F8EE} .card.bad{background:#FDE7E3}
.card.shake{animation:shake .35s}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}
.fb{min-height:2.6em;text-align:center;font-weight:700;font-size:1rem;margin-top:16px;text-wrap:balance}
.fb .ok{color:#137A4C} .fb .err{color:#B3311F}
.pop{position:absolute;left:50%;top:6px;translate:-50% 0;font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--ink);opacity:0;pointer-events:none}
.pop.go{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.8)}30%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-30px)}}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.yn button{height:76px;border-radius:24px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--white);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.yn button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.yn .n{background:var(--no)} .yn .y{background:var(--yes)}
.yn span{font-size:1.6rem;line-height:1}
.swipehint{text-align:center;font-size:.85rem;font-weight:600;color:var(--ink-soft);margin:0}

/* ---------- итог ---------- */
.res{background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.res h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;text-wrap:balance}
.stars{font-size:2.6rem;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.25}
.score{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.wl{width:100%;display:grid;gap:6px;text-align:left}
.wl div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--white);font-size:.95rem}
.wl div b{font-weight:700} .wl div span{color:var(--ink-soft);text-align:right;min-width:0}
.wl div.miss{background:#FDE7E3}
.zub{width:100%;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;text-align:left;background:var(--white);border:3px solid var(--ink);border-radius:20px;padding:12px}
.zub img{width:52px;height:52px;border-radius:14px}
.zub b{font-family:var(--f-display);font-weight:800;font-size:1rem}
.zub p{margin:2px 0 0;font-size:.88rem;color:var(--ink-soft)}
.zub .btn{grid-column:1/-1;height:52px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.btn{height:58px;border-radius:18px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:1.05rem;background:var(--white)}
.btn.main{background:var(--ink);color:var(--sun)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.demo{font-size:.78rem;text-align:center;color:var(--ink-soft);margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('blitz_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('blitz_'+k,JSON.stringify(v))}catch(e){}}};
let stars=store.get('stars',{}), best=store.get('best',{}), sound=store.get('sound',true);
const total=()=>Object.values(best).reduce((a,b)=>a+b,0);

/* голос: записи «Зубрилы» (Kokoro am_michael); если записи нет — голос устройства */
const IN_APP=location.hostname==='appassets.androidplatform.net';
const AUDIO=IN_APP?'audio/':'/app/audio/';
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
let cur=null, voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));voice=v.find(x=>/natural|google|samantha|premium|enhanced/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function tts(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function speak(t){if(!sound)return;try{if(cur)cur.pause()}catch(e){}
  let fell=false;const fb=()=>{if(!fell){fell=true;tts(t)}};
  try{const a=new Audio(AUDIO+slug(t)+'.mp3');cur=a;a.onerror=fb;const p=a.play();if(p&&p.catch)p.catch(fb)}catch(e){fb()}}

function openZubrila(){
  if(IN_APP)location.href='intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=ru.zubrilab.app;S.browser_fallback_url='+encodeURIComponent(ZUB_STORE)+';end';
  else window.open('/app/','_blank')||(location.href='/app/');
}
const zubCard=(title,text,btn)=>`<div class="zub"><img src="${ZUBMAIN}" alt="Зубрила"><div><b>${title}</b><p>${text}</p></div><button class="btn main" id="zub">${btn}</button></div>`;

/* ---------- карта уровней ---------- */
function unlocked(){let n=0;while(n<LEVELS&&stars[n])n++;return n}
function mapView(){
  const open=unlocked(), shown=Math.min(LEVELS,Math.max(12,Math.ceil((open+5)/4)*4));
  let cells='';
  for(let l=0;l<shown;l++){
    const s=stars[l]||0, isNext=l===open, locked=l>open;
    cells+=`<button class="lvl${isNext?' next':''}" ${locked?'disabled':''} data-l="${l}" aria-label="Уровень ${l+1}${s?', звёзд: '+s:''}">${l+1}<span class="st">${locked?'🔒':'★'.repeat(s)+'☆'.repeat(3-s)}</span></button>`;
  }
  $('#app').innerHTML=`
    <div class="top"><div class="brand"><img src="${ZUBR}" alt=""><div><b>Зубрила Блиц</b><small>да или нет</small></div></div><span class="chip">★ ${Object.values(stars).reduce((a,b)=>a+b,0)} · ${total().toLocaleString('ru-RU')} очк.</span></div>
    <div class="hello"><img src="${ZUBR}" alt=""><div><h1>${open===0?'Поехали! 8 слов за уровень':'Уровень '+(Math.min(open,LEVELS-1)+1)+' ждёт'}</h1><p>Видишь слово и перевод — жми «Да», если верно, «Нет», если нет. 3 ошибки — уровень заново.</p></div></div>
    <div class="map">${cells}</div>
    <p class="maphint">Уровень ${Math.min(open,LEVELS-1)+1} из ${LEVELS} · ${(LEVELS*PER).toLocaleString('ru-RU')} самых нужных английских слов</p>
    <div class="row"><button class="btn main" id="go">▶ Уровень ${Math.min(open,LEVELS-1)+1}</button><button class="btn" id="snd">${sound?'🔊 Звук вкл':'🔇 Звук выкл'}</button></div>
    ${zubCard('Хочешь выучить всерьёз?','«Зубрила» — тренажёр: вписываешь слова и повторяешь через неделю, месяц. Слова остаются навсегда.',IN_APP?'Скачать Зубрилу':'Открыть Зубрилу')}`;
  $('#zub').onclick=openZubrila;
  document.querySelectorAll('.lvl:not(:disabled)').forEach(b=>b.onclick=()=>play(+b.dataset.l));
  $('#go').onclick=()=>play(Math.min(open,LEVELS-1));
  $('#snd').onclick=()=>{sound=!sound;store.set('sound',sound);mapView()};
}

/* ---------- уровень ---------- */
let G=null;
function deck(l){
  const ids=[...Array(PER)].map((_,k)=>l*PER+k);
  // каждое слово дважды: один раз с верным переводом, один раз с чужим (из того же круга слов)
  const pool=[...Array(Math.min(WORDS.length,l*PER+60))].map((_,k)=>k);
  let cards=[];
  for(const i of ids){
    cards.push({i,ru:WORDS[i][1],truth:true});
    let j;do{j=pool[Math.random()*pool.length|0]}while(j===i||WORDS[j][1]===WORDS[i][1]);
    cards.push({i,ru:WORDS[j][1],truth:false});
  }
  for(let t=0;t<50;t++){shuffle(cards);if(cards.every((c,k)=>!k||c.i!==cards[k-1].i))break}
  return cards;
}
function play(l){
  G={l,cards:deck(l),pos:0,lives:3,combo:0,score:0,miss:new Set(),res:[],t0:0,timer:null,lock:false};
  $('#app').innerHTML=`
    <div class="hud"><button class="back" id="back" aria-label="К уровням">✕</button><span class="hearts" id="hearts"></span><span class="combo" id="combo"></span></div>
    <div class="dots" id="dots">${G.cards.map(()=>'<i></i>').join('')}</div>
    <div class="stage"><div class="pop" id="pop"></div><div class="card" id="card"></div><div class="fb" id="fb"></div></div>
    <div class="yn"><button class="n" id="no"><span>✗</span>Нет</button><button class="y" id="yes"><span>✓</span>Да</button></div>
    <p class="swipehint">Можно смахивать карточку: вправо — да, влево — нет</p>`;
  $('#back').onclick=()=>{clearTimer();mapView()};
  $('#yes').onclick=()=>answer(true);$('#no').onclick=()=>answer(false);
  swipe($('#card'));
  show();
}
function hud(){
  $('#hearts').innerHTML=[0,1,2].map(k=>`<span class="${k<G.lives?'':'off'}">❤️</span>`).join('');
  $('#combo').textContent=G.combo>=3?'×'+mult()+' комбо':'';
  document.querySelectorAll('#dots i').forEach((d,k)=>{d.className=k<G.res.length?(G.res[k]?'ok':'bad'):k===G.pos?'now':''});
}
const mult=()=>1+Math.floor(G.combo/3);
function show(){
  if(G.pos>=G.cards.length||G.lives<=0){finish();return}
  const c=G.cards[G.pos], w=WORDS[c.i];
  const el=$('#card');el.className='card';el.style.transform='';
  el.innerHTML=`<span class="stamp y">ДА</span><span class="stamp n">НЕТ</span><span class="q">Это правильный перевод?</span><div class="en">${esc(w[0])}</div><button class="say" id="say">🔊 Послушать</button><div class="ru"><p style="margin:0;white-space:nowrap"><span>${esc(c.ru)}</span><span class="eq" aria-hidden="true">?</span></p></div><div class="timer"><i id="tb"></i></div>`;
  $('#say').onclick=e=>{e.stopPropagation();speak(w[0])};
  $('#fb').innerHTML='';hud();fit();speak(w[0]);
  G.lock=false;G.t0=performance.now();startTimer();
}
function fit(){
  const en=document.querySelector('.card .en'), ru=document.querySelector('.card .ru'), p=ru&&ru.firstElementChild;
  if(!en||!ru)return; en.style.fontSize=ru.style.fontSize='';
  let size=parseFloat(getComputedStyle(en).fontSize);
  const over=()=>en.scrollWidth>en.clientWidth+1||p.scrollWidth>ru.clientWidth+1;
  while(over()&&size>14){size-=1;en.style.fontSize=ru.style.fontSize=size+'px'}
}
addEventListener('resize',()=>{if(G)fit()});
function startTimer(){
  clearTimer();const tb=$('#tb');
  const tick=()=>{const p=1-(performance.now()-G.t0)/CARD_MS;if(tb)tb.style.transform=`scaleX(${Math.max(0,p)})`;if(p<=0){answer(null);return}G.timer=requestAnimationFrame(tick)};
  G.timer=requestAnimationFrame(tick);
}
function clearTimer(){if(G&&G.timer)cancelAnimationFrame(G.timer)}
function answer(v){
  if(!G||G.lock)return;G.lock=true;clearTimer();
  const c=G.cards[G.pos], w=WORDS[c.i], right=v===c.truth, el=$('#card');
  G.res.push(right);
  if(right){
    G.combo++;const ms=performance.now()-G.t0, pts=Math.round((100+Math.max(0,CARD_MS-ms)/40)*mult());G.score+=pts;
    el.classList.add('good');const p=$('#pop');p.textContent='+'+pts;p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
    $('#fb').innerHTML=`<span class="ok">${c.truth?'Верно!':'Верно, это не «'+esc(c.ru)+'»'}</span>`;
  }else{
    G.combo=0;G.lives--;G.miss.add(c.i);el.classList.add('bad','shake');
    $('#fb').innerHTML=`<span class="err">${v===null?'Время вышло. ':''}${esc(w[0])} — это «${esc(w[1])}»</span>`;
  }
  hud();G.pos++;
  setTimeout(show,right?650:1500);
}
function swipe(el){
  let x0=null,dx=0,id=null;
  el.addEventListener('pointerdown',e=>{if(G.lock||e.target.closest('button'))return;x0=e.clientX;dx=0;id=e.pointerId;el.setPointerCapture(id)});
  el.addEventListener('pointermove',e=>{if(x0===null||e.pointerId!==id)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.querySelector('.stamp.y').style.opacity=Math.max(0,Math.min(1,dx/90));el.querySelector('.stamp.n').style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>90)answer(dx>0);else{el.style.transform='';el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
document.addEventListener('keydown',e=>{if(!G||!$('#yes'))return;if(e.key==='ArrowRight')answer(true);if(e.key==='ArrowLeft')answer(false)});

/* ---------- итог ---------- */
function finish(){
  clearTimer();const l=G.l, won=G.lives>0, s=won?3-G.miss.size>0?Math.max(1,3-G.miss.size):1:0;
  if(won){stars[l]=Math.max(stars[l]||0,s);best[l]=Math.max(best[l]||0,G.score);store.set('stars',stars);store.set('best',best)}
  const ids=[...Array(PER)].map((_,k)=>l*PER+k);
  $('#app').innerHTML=`
    <div class="top"><div class="brand"><img src="${ZUBR}" alt=""><div><b>Уровень ${l+1}</b><small>${won?'пройден':'не пройден'}</small></div></div><span class="chip">★ ${Object.values(stars).reduce((a,b)=>a+b,0)}</span></div>
    <div class="res">
      <h2>${won?(s===3?'Без единой ошибки!':s===2?'Отлично!':'Пройдено!'):'Три ошибки — попробуй ещё раз'}</h2>
      <div class="stars">${[0,1,2].map(k=>`<span class="${k<s?'':'off'}">⭐</span>`).join('')}</div>
      <div class="score">${G.score.toLocaleString('ru-RU')}<small>очков</small></div>
      <div class="wl">${ids.map(i=>`<div class="${G.miss.has(i)?'miss':''}"><b>${esc(WORDS[i][0])}</b><span>${esc(WORDS[i][1])}</span></div>`).join('')}</div>
      ${G.miss.size?zubCard('Запомни трудные слова','В «Зубриле» слово повторяется, пока не запомнится: сегодня, через неделю и через месяц.','Учить в Зубриле'):''}
      <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn main" id="next">${won&&l+1<LEVELS?'Дальше →':'К уровням'}</button></div>
    </div>`;
  $('#again').onclick=()=>play(l);
  if($('#zub'))$('#zub').onclick=openZubrila;
  $('#next').onclick=()=>won&&l+1<LEVELS?play(l+1):mapView();
  G=null;
}
mapView();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
